<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ROOM OVER!</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--ink:#111;--paper:#fffdf4;--bg:#e6e1d3;--red:#d8141c;--yel:#ffe500;--blue:#1565c0;--mut:#6b675c}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo","Noto Sans JP",sans-serif;font-size:14px;line-height:1.5}
#app{max-width:1080px;margin:0 auto;padding:10px;min-height:100vh}
h1,h2,h3{margin:0;font-weight:900}
button{font:inherit;font-weight:800;cursor:pointer;border:2px solid var(--ink);background:var(--ink);color:#fff;padding:.4em .8em;border-radius:0}
button:hover{background:#333}
button.red{background:var(--red);border-color:var(--red)}
button.red:hover{background:#b30f15}
button.ghost{background:var(--paper);color:var(--ink)}
button.ghost:hover{background:#f1ecd9}
button:disabled{opacity:.35;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--blue);outline-offset:1px}
.paper{background:var(--paper);border:3px solid var(--ink)}
/* menu */
.menu{text-align:center;padding:26px 14px 30px;margin-top:4vh}
.logo{display:inline-block;background:var(--yel);border:4px solid var(--ink);padding:.05em .35em;font-size:clamp(40px,11vw,96px);font-weight:900;letter-spacing:-.02em;transform:rotate(-2deg);box-shadow:8px 8px 0 var(--red)}
.logo span{color:var(--red)}
.catch{font-size:clamp(15px,3vw,22px);font-weight:900;margin:22px 0 4px}
.sub{color:var(--mut);margin-bottom:20px}
.mrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.mrow button{font-size:18px;padding:.6em 1.3em}
.lv{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:18px;text-align:left}
.lv button{background:var(--paper);color:var(--ink);padding:12px;text-align:left;font-weight:500}
.lv button:hover{background:var(--yel)}
.lv b{display:block;font-size:22px;font-weight:900}
/* header */
.hd{display:flex;flex-wrap:wrap;align-items:stretch}
.hd .ttl{background:var(--yel);padding:6px 12px;font-weight:900;font-size:22px;border-right:3px solid var(--ink);display:flex;align-items:center}
.hd .ttl span{color:var(--red)}
.st{padding:5px 12px;border-right:1px solid #bbb;flex:1 1 auto}
.st small{display:block;color:var(--mut);font-size:11px;font-weight:700}
.st b{font-size:17px;font-weight:900;white-space:nowrap}
.st b.neg{color:var(--red)}
.hd .acts{display:flex;gap:6px;padding:6px;align-items:center}
.trend{margin-top:8px;padding:6px 10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.trend>b{background:var(--red);color:#fff;padding:1px 8px;font-weight:900}
.tg{border:1.5px solid var(--red);color:var(--red);padding:0 6px;font-weight:800;font-size:12px;background:#fff}
.news{margin-top:8px;padding:8px 10px;border-left:10px solid var(--yel)}
.news ul{margin:2px 0 0;padding-left:1.2em}
.tabs{display:flex;gap:4px;margin-top:10px;flex-wrap:wrap}
.tabs button{background:var(--paper);color:var(--ink);border-bottom-width:0;padding:.5em .9em}
.tabs button.on{background:var(--ink);color:#fff}
.body{padding:12px;border-top-width:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{border:2px solid var(--ink);background:#fff;padding:8px;display:flex;flex-direction:column;gap:5px;position:relative}
.card h3{font-size:15px}
.plan{width:100%;height:auto;max-height:230px;background:#fff;display:block}
.meta{font-size:12px;color:var(--mut)}
.price{font-size:20px;font-weight:900;color:var(--red)}
.price small{font-size:12px;color:var(--ink)}
.bd{display:inline-block;padding:0 7px;font-size:12px;font-weight:900;border:2px solid var(--ink);margin-right:3px}
.bd.rent{background:var(--ink);color:#fff}.bd.list{background:var(--yel)}.bd.sale{background:var(--blue);border-color:var(--blue);color:#fff}
.bd.bad{background:var(--red);border-color:var(--red);color:#fff}.bd.new{border-color:var(--blue);color:var(--blue)}
.row{display:flex;gap:5px;flex-wrap:wrap;margin-top:auto}
.row button{font-size:13px;padding:.3em .6em}
details{font-size:12px}summary{cursor:pointer;color:var(--blue);font-weight:700}
details ul{margin:3px 0;padding-left:1.2em}
.stamp{position:absolute;top:34px;right:8px;border:3px solid var(--red);color:var(--red);font-weight:900;font-size:20px;padding:0 8px;transform:rotate(-12deg);background:rgba(255,255,255,.85);pointer-events:none}
.full{background:var(--red);color:#fff;font-weight:900;padding:1px 10px;transform:rotate(-2deg);display:inline-block}
.note{color:var(--mut);font-size:12px;margin:0 0 10px}
.stars{color:#e59a00;letter-spacing:-1px;font-size:15px}
/* modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-start;justify-content:center;padding:14px;overflow:auto;z-index:20}
#modal.on{display:flex}
.mbox{background:var(--paper);border:4px solid var(--ink);width:min(100%,900px);padding:14px;box-shadow:8px 8px 0 var(--yel)}
.mbox h2{font-size:20px;border-bottom:3px solid var(--ink);padding-bottom:4px;margin-bottom:10px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.ed{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:14px}
@media(max-width:680px){.ed{grid-template-columns:1fr}}
.catrow{margin-bottom:7px}
.catrow>b{display:block;font-size:12px;border-left:6px solid var(--ink);padding-left:6px;margin-bottom:3px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{background:#fff;color:var(--ink);font-weight:600;font-size:12px;padding:.25em .55em;border-width:1.5px}
.chip:hover{background:#f1ecd9}
.chip.on{background:var(--ink);color:#fff}
.chip small{opacity:.7;margin-left:4px}
.chip i{font-style:normal;color:var(--red);font-weight:900;margin-left:4px}
.chip.on i{color:var(--yel)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:1px 10px;font-size:13px;margin:8px 0}
.kv dt{color:var(--mut);font-weight:700}.kv dd{margin:0;font-weight:800;text-align:right}
input[type=range]{width:100%}
input[type=text]{font:inherit;border:2px solid var(--ink);padding:.3em .5em;background:#fff;width:100%}
.cust{border:2px solid var(--ink);background:#fff;padding:8px;display:flex;gap:10px;align-items:center}
.face{width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-weight:900;font-size:18px;flex:none}
table{border-collapse:collapse;width:100%;background:#fff}
th,td{border:1px solid #999;padding:3px 7px;font-size:13px;text-align:left}
th{background:var(--ink);color:#fff}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.log{max-height:420px;overflow:auto;background:#fff;border:2px solid var(--ink);padding:6px 10px;font-size:13px}
.log div{border-bottom:1px dotted #bbb;padding:2px 0}.log small{color:var(--mut);margin-right:8px}
.v3{border:2px solid var(--ink);background:#efe9d8;min-height:120px}
.ge{display:grid;grid-template-columns:repeat(12,1fr);gap:1px;background:#888;border:2px solid var(--ink);touch-action:none;-webkit-user-select:none;user-select:none}
.gc{aspect-ratio:1;font-size:9px;font-weight:800;display:grid;place-items:center;cursor:crosshair;overflow:hidden}
.gc.em{background-image:radial-gradient(#ccc 1px,transparent 1px)!important;background-size:6px 6px}
.swb{display:inline-block;width:46px;height:26px;border:1px solid #555;margin-right:8px;vertical-align:middle}
.sw{display:inline-block;width:16px;height:16px;border:1px solid #555;margin-right:4px;vertical-align:-3px}
.err{color:var(--red);font-weight:800;font-size:12px;margin-top:6px}
.sec{margin:16px 0 6px;border-left:8px solid var(--red);padding-left:8px;font-size:17px}.sec:first-child{margin-top:0}
.tg.lt{background:var(--yel);color:var(--ink);border-color:var(--ink)}
button{transition:transform .06s,box-shadow .06s}
button:active:not(:disabled){transform:translate(2px,2px) scale(.97)}
button.red:not(:disabled){box-shadow:3px 3px 0 var(--ink)}
button.red:active:not(:disabled){box-shadow:0 0 0 var(--ink);transform:translate(3px,3px)}
.card{transition:transform .12s,box-shadow .12s}
.card:hover{transform:translateY(-2px);box-shadow:4px 4px 0 var(--yel)}
.news li{animation:slide .45s both}.news li:nth-child(2){animation-delay:.08s}.news li:nth-child(3){animation-delay:.16s}.news li:nth-child(n+4){animation-delay:.24s}
@keyframes slide{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
.pulse{display:inline-block;animation:pulse .7s}
@keyframes pulse{0%{transform:scale(1)}30%{transform:scale(1.25);background:var(--yel)}100%{transform:scale(1)}}
#fx{position:fixed;inset:0;z-index:30;pointer-events:none;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden}
#fx.on{display:flex}
.fxm{background:var(--ink);color:#fff;font-weight:900;font-size:clamp(28px,7vw,60px);padding:.05em .6em;box-shadow:8px 8px 0 var(--yel);animation:fxin 1.5s both}
.fxd{font-weight:900;font-size:clamp(16px,4vw,28px);background:var(--paper);border:3px solid var(--ink);padding:0 .6em;animation:fxin 1.5s .08s both}
.fxd.pos{color:#0a7d2c}.fxd.neg{color:var(--red)}
.fxs{font-weight:900;font-size:clamp(28px,8vw,76px);color:var(--red);border:6px solid var(--red);padding:0 .3em;background:rgba(255,255,255,.92);animation:stamp 1.9s .2s both;white-space:nowrap}
.fxs.bad{color:#fff;background:#111;border-color:#111}
@keyframes fxin{0%{opacity:0;transform:translateY(-40px) scale(.7)}12%{opacity:1;transform:none}80%{opacity:1;transform:none}100%{opacity:0;transform:translateY(24px)}}
@keyframes stamp{0%{opacity:0;transform:rotate(-8deg) scale(3.2)}12%{opacity:1;transform:rotate(-8deg) scale(.95)}18%{transform:rotate(-8deg) scale(1)}85%{opacity:1;transform:rotate(-8deg) scale(1)}100%{opacity:0;transform:rotate(-8deg) scale(1)}}
.cf{position:fixed;top:-16px;width:10px;height:15px;animation:fall 1.5s linear both}
@keyframes fall{to{transform:translateY(108vh) rotate(600deg)}}
@keyframes fade{0%{opacity:0}15%,80%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.fxm,.fxd,.fxs{animation:fade 1.6s both}.cf,.pulse,.news li{animation:none}.cf{display:none}.card:hover{transform:none}}
</style>
</head>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const R=(a,b)=>a+Math.random()*(b-a),RI=(a,b)=>Math.floor(R(a,b+1)),pick=a=>a[RI(0,a.length-1)];

  const s=x>=10000?Math.floor(x/10000)+"億"+(x%10000?(x%10000).toLocaleString()+"万":""):x.toLocaleString()+"万";return(n?"-":"")+s+"円"}

 {k:"door",n:"扉",items:[["合板ドア",5,1],["木製ドア",12,2],["防音ドア",25,3],["スマートロックドア",45,4]]},

 {k:"kitchen",n:"キッチン",items:[["ミニキッチン",10,1],["壁付けキッチン",25,2],["対面キッチン",50,3],["アイランドキッチン",90,4]]},
 {k:"stove",n:"コンロ",items:[["1口電気コンロ",3,1],["2口ガスコンロ",8,2],["3口ガスコンロ",15,3],["3口IH",28,4]]},
 {k:"wash",n:"洗面台",items:[["コンパクト洗面",4,1],["独立洗面台",12,2],["シャンプードレッサー",22,3],["ホテルライク2ボウル",40,4]]},

const CK={};CAT.forEach(c=>{CK[c.k]=c;c.order=c.items.map((_,i)=>i).sort((a,b)=>c.items[a][1]-c.items[b][1])});
const TATAMI=1;
const LV={
 small:{n:"Small",money:1500,pGood:.95,gem:1,hi:.8,lo:.8,mul:[.5,.65],noise:.3,age:[0,6],k:0,pDeath:.002,hint:2,
   d:"いい間取りが毎回格安で買える。業者も優良ぞろい。流行は偏りなくまんべんなく。"},
 nomal:{n:"Nomal",money:1000,pGood:.6,gem:.45,hi:.75,lo:.35,mul:[.8,1.15],noise:1.3,age:[0,20],k:1,pDeath:.004,hint:1,
   d:"いい業者・いい間取りに会えるかは運しだい。見分けるのは少し難しい。流行はやや高級品寄り。"},
 pro:{n:"Pro",money:700,pGood:.35,gem:.07,hi:.8,lo:.18,mul:[.95,1.5],noise:2.4,age:[6,35],k:2.5,pDeath:.007,hint:0,
   d:"いい間取りにはほぼ会えない。業者は当たり外れが激しく、評判もあてにならない。流行は高級品に偏りまくる。"}
};
const GW=12,GH=8,LIVING="LRSU";
const TPL=[
 {n:"1R",t:"スタンダード1R",d:"いちばん小さくて安い基本形",r:["LLLKK","LLLKK","LLLBB","LLLTE"]},
 {n:"1K",t:"スタンダード1K",d:"洗面と収納つきの単身向け",r:["LLLLKK","LLLLKK","LLLLBW","CCLLTE"]},
 {n:"1LDK",t:"スタンダード1LDK",d:"寝室を分けた二人暮らし向け",r:["LLLLLKKK","LLLLLBBW","LLLLLBBW","RRRRCTEE","RRRRCTEE"]},
 {n:"2LDK",t:"スタンダード2LDK",d:"南側に2部屋を並べたファミリー向け",r:["LLLLLLKKBB","LLLLLLKKBB","LLLLLLCCWT","LLLLLLCCWT","RRRRSSSSEE","RRRRSSSSEE"]},
 {n:"3LDK",t:"スタンダード3LDK",d:"3部屋そろった広めのファミリー向け",r:["LLLLLKKUUU","LLLLLKKUUU","LLLLLBBUUU","LLLLLBBWWT","RRRRSSSSCT","RRRRSSSSCE","RRRRSSSSEE","RRRRSSSSEE"]},
 {n:"1R",t:"縦長1R",d:"玄関から奥へ伸びる細長い部屋",r:["EKBB","TKLL","LLLL","LLLL","LLLL"]},
 {n:"1K",t:"キッチン広々1K",d:"料理好き向けの大きなキッチン",r:["LLLLKK","LLLLKK","LLLLKK","CCLLBW","EELLBT"]},
 {n:"1LDK",t:"L字リビング1LDK",d:"寝室を囲むL字の大きなリビング",r:["LLLLLLKK","LLLLLLKK","LLLRRRRC","LLLRRRRC","BBWRRRRE","BBTCCEEE"]},
 {n:"2LDK",t:"コンパクト2LDK",d:"面積を抑えて2部屋を確保",r:["LLLLLKKK","LLLLLKKK","LLLLLBBW","RRRSSSCT","RRRSSSCE","RRRSSSEE"]},
 {n:"2LDK",t:"振り分け2LDK",d:"リビングをはさんで2部屋が離れた人気の形",r:["RRRLLLLSSS","RRRLLLLSSS","RRRLLLLSSS","RRRLLLLSSS","CCKKKEEBBW","CCKKKEEBBT"]},
 {n:"3LDK",t:"ワイドリビング3LDK",d:"横長の大きなリビングが主役",r:["LLLLLLLLKKKK","LLLLLLLLKKKK","LLLLLLLLBBWW","LLLLLLLLBBTC","RRRRSSSSUUUC","RRRRSSSSUUUE","RRRRSSSSUUUE"]}
];
const KIND=[["L","LDK・居間","#f3d9a4","L"],["R","居室1","#f6c7a0","1"],["S","居室2","#f2b6b0","2"],["U","居室3","#e0b8e8","3"],["K","キッチン","#ffe97a","K"],["B","浴室","#a9d8ee","浴"],["W","洗面","#c5e6f2","洗"],["T","トイレ","#cfe8d0","WC"],["C","収納","#d9d9d9","収"],["E","玄関","#bdbdbd","玄"],[".","なし（消す）","#ffffff",""]];
const KC={};KIND.forEach(k=>KC[k[0]]=k);
const DEF={};CAT.forEach(c=>DEF[c.k]=c.order[1]);
const ltHit=u=>!!(G&&G.ltrend&&G.ltrend===typeName(u));
function tplGrid(i,flip){return Array.from({length:GH},(_,y)=>{const src=TPL[i].r[y]||"";let r=flip?src.split("").reverse().join(""):src;return r.padEnd(GW,".")}).join("")}
function rndGrid(i,pBad){let g=tplGrid(i,Math.random()<.5);if(Math.random()<pBad)g=g.replace(/C/g,"L").replace(/W/g,"B");return g}
const at=(g,x,y)=>(x<0||y<0||x>=GW||y>=GH)?".":g[y*GW+x];
const area=u=>u.grid.replace(/\./g,"").length;
function typeName(u){const g=u.grid,b=["R","S","U"].filter(k=>g.includes(k)).length;
  if(g.includes("L"))return b?b+"LDK":area(u)<23?"1R":"1K";return b?b+"K":"—"}
const baseRent=u=>1.9+.185*area(u);
const layoutBonus=g=>(g.includes("W")?4:0)+(g.includes("C")?4:0);
function gridErr(g){const e=[];if(!/[LRSU]/.test(g))e.push("居間か居室が必要");
  [["K","キッチン"],["B","浴室"],["T","トイレ"],["E","玄関"]].forEach(k=>{if(!g.includes(k[0]))e.push(k[1]+"が必要")});
  if(g.replace(/\./g,"").length<12)e.push("12㎡以上が必要");return e}
function edges(g){const outer=[],inner=[],seen={};
  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){const k=at(g,x,y);if(k===".")continue;
    [[0,-1,"n"],[1,0,"e"],[0,1,"s"],[-1,0,"w"]].forEach(([dx,dy,s])=>{const n=at(g,x+dx,y+dy);
      if(n===".")outer.push({x,y,s,k});
      else if(n!==k&&(s==="e"||s==="s")){const key=k<n?k+n:n+k,hub=/[LE]/.test(key)||key==="BW";const door=hub&&!seen[key];if(hub)seen[key]=1;inner.push({x,y,s,door})}})}
  return{outer,inner}}
function mig(u){if(u&&!u.grid)u.grid=tplGrid(u.type==null?1:u.type,!!u.flip);return u}
const WALL3=["#f3f1ea","#e4d3ae","#a9a9a6","#7fa3bf","#b9b4ad","#f5f2ea","#d8b25a","#b8643c","#cfc6b4","#b98d5a"];
/* ===== テクスチャ（すべて自動生成） ===== */
const FT=[{t:"speck",c:"#e9e1cc"},{t:"tatami",c:"#cdd69c"},{t:"wood",c:"#c99a5b",v:.1},{t:"wood",c:"#6b4630",v:.14},{t:"marble",c:"#f2f2f4"},
  {t:"wood",c:"#e3c08a",v:.06,knot:1},{t:"wood",c:"#ead7b4",v:.05},{t:"wood",c:"#a8703c",v:.12},{t:"herring",c:"#b98a55"}];

function newTrends(first){
  const k=L().k,cats=CAT.slice().sort(()=>Math.random()-.5).slice(0,5);G.trends={};
  cats.forEach(c=>{const w=c.items.map(i=>Math.pow(i[1]+1,k));let r=Math.random()*w.reduce((a,b)=>a+b,0),i=0;
    while(r>w[i]&&i<w.length-1){r-=w[i];i++}G.trends[c.k]=i});
  if(G.trends.floor===TATAMI)G.stale=0;else if(!first)G.stale++;
  {const ts=[["1R",5.6],["1K",6.5],["1LDK",9.3],["2LDK",13],["3LDK",16.7]],w=ts.map(t=>Math.pow(t[1],k));let r=Math.random()*w.reduce((a,b)=>a+b,0),i=0;
    while(r>w[i]&&i<ts.length-1){r-=w[i];i++}G.ltrend=ts[i][0]}
  if(!first)log("📣 新しい年！流行が入れ替わった：間取り「"+G.ltrend+"」、"+trendNames().join("、"));
}

function genOffer(){

  const age=RI(l.age[0],l.age[1])*12+RI(0,11),u={id:0,name:bname()+" "+RI(1,9)+"F",grid,items:randItems(gem?l.hi:l.lo),age,
    sinceReno:Math.random()<.25?RI(0,Math.min(age,60)):age,flip:Math.random()<.5,st:"vacant",rent:0,ask:0,stay:0,accident:false,defect:false};

  const o={u,price,gyo:pick(GYO),stars,hd:!good&&Math.random()<.6,ha:!good&&Math.random()<(G.lv==="pro"?.3:.18)};
  o.rev=l.hint===0?pick(REV_G.concat(REV_B,REV_N)):stars>=3.8?pick(REV_G):stars<=2.6?pick(REV_B):pick(REV_N);

const prefText=c=>c.pref==="trend"?"流行りの部屋に住みたい":c.pref==="new"?"きれいで新しい部屋がいい":CK[c.pref].n+"にこだわりたい";
function custAsk(u,c){return c.buy?Math.round(value(u)*1.1):(u.st==="list"?u.rent:fair(u))}
function match(u,c){
  let m=.45;const ask=custAsk(u,c);
  if(c.pref==="trend"){const n=trendCount(u);m+=n>=2?.3:n===0?-.2:0}
  else if(c.pref==="new")m+=u.sinceReno<36?.3:u.sinceReno>120?-.2:0;
  else{const q=CK[c.pref].items[u.items[c.pref]][2];m+=q>=3?.3:q<=1?-.2:0}
  m+=ask<=c.budget?.25:-(ask/c.budget-1)*2;

function advance(){
  const l=L();G.month++;G.news=[];
  const say=t=>{G.news.push(t);log(t)};
  let inc=0,cost=0;
  const all=G.units.length>=2&&G.units.every(u=>u.st==="rent");
  G.units.slice().forEach(u=>{
    u.age++;u.sinceReno++;cost+=1;
    if(u.st==="rent"){inc+=u.rent;u.stay++;
      if(Math.random()<l.pDeath){u.accident=true;u.st="vacant";cost+=30;say(`☠ ${u.name} で入居者が亡くなった…事故物件になり、特殊清掃に30万円かかった。`)}
      else if(u.stay>12&&Math.random()<.04){u.st="vacant";say(`📦 ${u.name} の入居者が退去した。`)}
    }else if(u.st==="list"){if(Math.random()<rentChance(u,u.rent)){u.st="rent";u.stay=0;say(`🔑 ${u.name} に入居が決まった！（家賃 ${man(u.rent)}）`)}}
    else if(u.st==="sale"){if(Math.random()<saleChance(u,u.ask)){G.money+=u.ask;G.units=G.units.filter(x=>x!==u);say(`🤝 ${u.name} が ${yen(u.ask)} で売れた！`)}}
  });
  if(all){const b=r1(inc*.05);inc+=b;say(`🈵 満室ボーナス！ +${man(b)}`)}
  if(G.office)cost+=5;
  G.builds=G.builds.filter(b=>{b.left--;if(b.left>0)return true;
    for(let f=1;f<=b.floors;f++)G.units.push(mkUnit(b.grid,Object.assign({},b.items),0,0,`${b.name} ${f}F`));
    say(`🏢 ${b.name}（${b.floors}階建て）が完成！ ${b.floors}部屋が手に入った。`);return false});
  G.money=r1(G.money+inc-cost);G.last={inc:r1(inc),cost:r1(cost)};
  if(G.month%12===0){newTrends(false);G.news.push("📣 流行が入れ替わった！")}
  G.offers=[genOffer(),genOffer(),genOffer()];
  G.cust=G.office?Array.from({length:RI(2,3)},genCust):[];
  G.neg=G.money<0?G.neg+1:0;
  if(G.neg===1)say("⚠ 資金がマイナスに。6ヶ月続くと倒産です。");
  if(G.neg>=6){G.over=true}
  const fullNow=G.units.length>=2&&G.units.every(u=>u.st==="rent"),became=fullNow&&!G.wasFull;G.wasFull=fullNow;
  saveG();closeModal();UI.pulse=true;render();UI.pulse=false;monthFx(became);
}

    let c;
    if(c=cells.K){const mTop=mat(["#bdbdbd","#d9d9d9","#f3f3f3","#3a3a3a"][it.kitchen]),mB=mat(it.stove===3?"#111111":"#b02020");
